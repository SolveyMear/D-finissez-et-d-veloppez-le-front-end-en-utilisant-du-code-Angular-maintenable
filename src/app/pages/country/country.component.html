<main>
  <p *ngIf="error" role="alert">{{ error }}</p>

  <ng-container *ngIf="statistics as data">
    <h2 class="center"><span>{{ data.country }}</span></h2>

    <section class="split" aria-label="Country statistics">
      <app-stat label="Number of entries" [value]="data.totalEntries"></app-stat>
      <app-stat label="Total number of medals" [value]="data.totalMedals"></app-stat>
      <app-stat label="Total number of athletes" [value]="data.totalAthletes"></app-stat>
    </section>

    <app-line-chart
      [years]="data.years"
      [medals]="data.medalsByYear"
      [country]="data.country">
    </app-line-chart>
  </ng-container>

  <div class="center country-navigation">
    <a routerLink="">Go back</a>
  </div>
</main>
