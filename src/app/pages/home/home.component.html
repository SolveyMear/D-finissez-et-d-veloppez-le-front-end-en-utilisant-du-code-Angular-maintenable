<main>
  <h2 class="center"><span>{{ titlePage }}</span></h2>

  <p *ngIf="error" role="alert">{{ error }}</p>

  <ng-container *ngIf="statistics as data">
    <section class="split" aria-label="Olympic statistics">
      <app-stat label="Number of countries" [value]="data.totalCountries"></app-stat>
      <app-stat label="Number of Olympic Games" [value]="data.totalOlympicGames"></app-stat>
    </section>

    <app-pie-chart
      [countries]="data.countries"
      [medals]="data.medalsByCountry"
      (countrySelected)="navigateToCountry($event)">
    </app-pie-chart>

    <nav class="country-navigation" aria-label="View country statistics">
      <h3>View statistics by country</h3>
      <ul>
        <li *ngFor="let country of data.countries">
          <a [routerLink]="['/country', country]">{{ country }}</a>
        </li>
      </ul>
    </nav>
  </ng-container>
</main>
